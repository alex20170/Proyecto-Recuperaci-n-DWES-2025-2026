{% extends 'base.html' %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
    <h1>Confirmar eliminación</h1>

    <p>¿Seguro que quieres eliminar esta receta?</p>
    <p><strong>Receta:</strong> {{ object.titulo }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
    </form>

    <a href="{% url 'detalle_receta' object.pk %}">Cancelar</a>
{% endblock %}
